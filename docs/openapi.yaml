openapi: 3.1.0
info:
  title: Running Event Platform API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  summary: API สำหรับแพลตฟอร์มรับสมัครงานวิ่ง (นักวิ่ง / ผู้จัดงาน / Staff / แอดมิน)
  description: |
    API ของแพลตฟอร์มรับสมัครงานวิ่ง แบบเดียวกับ thai.run / RunSignup

    ข้อตกลงทั่วไป
    - จำนวนเงินทุกฟิลด์เป็น **integer หน่วยสตางค์** (เช่น 59000 = 590.00 บาท) สกุลเงิน THB
    - เวลาเป็น ISO 8601 (UTC) เว้นแต่ระบุไว้
    - Error ใช้รูปแบบ RFC 7807 (`application/problem+json`)
    - POST ที่เกี่ยวกับเงินต้องส่ง header `Idempotency-Key`
    - รายการแบบแบ่งหน้าใช้ `page` / `per_page` และตอบกลับด้วย envelope `{ data, meta }`
servers:
  - url: https://api.example.run/v1
    description: Production

tags:
  - name: Auth
    description: สมัครสมาชิก / เข้าสู่ระบบ
  - name: Me
    description: ข้อมูลบัญชีและโปรไฟล์ของนักวิ่ง
  - name: My Registrations
    description: งานที่สมัคร โอนสิทธิ์ เปลี่ยนระยะ ขอคืนเงิน
  - name: Public Events
    description: ค้นหาและดูรายละเอียดงานวิ่ง (ไม่ต้องล็อกอิน)
  - name: Public Results
    description: ผลการแข่งขันและใบประกาศ
  - name: Waitlist
    description: รายชื่อรอเมื่อโควต้าเต็ม
  - name: Checkout
    description: จองโควต้าและสร้างคำสั่งซื้อ
  - name: Payments
    description: ชำระเงินและ webhook จาก payment gateway
  - name: Org Events
    description: ผู้จัดงาน - จัดการงาน ระยะ ราคา สินค้า ฟอร์ม คูปอง
  - name: Org Registrations
    description: ผู้จัดงาน - จัดการผู้สมัคร บิบ export
  - name: Org Results
    description: ผู้จัดงาน - นำเข้าและเผยแพร่ผลการแข่งขัน
  - name: Org Communication
    description: ผู้จัดงาน - ส่งข้อความถึงผู้สมัคร
  - name: Org Team
    description: ผู้จัดงาน - สมาชิกทีมและบัญชี staff
  - name: Org Finance
    description: ผู้จัดงาน - ธุรกรรมและการโอนเงิน
  - name: Checkin
    description: Staff หน้างาน - สแกน QR รับเสื้อ/บิบ
  - name: Admin
    description: แอดมินแพลตฟอร์ม

security:
  - userAuth: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: สมัครสมาชิกด้วยอีเมล
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, accept_terms]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                phone: { type: string }
                accept_terms: { type: boolean }
                consents: { $ref: '#/components/schemas/Consents' }
      responses:
        '201':
          description: สมัครสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: เข้าสู่ระบบด้วยอีเมลและรหัสผ่าน
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp:
    post:
      tags: [Auth]
      operationId: authRequestOtp
      summary: ขอรหัส OTP ทางเบอร์โทรหรืออีเมล
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, destination]
              properties:
                channel: { type: string, enum: [sms, email] }
                destination: { type: string }
      responses:
        '202':
          description: ส่ง OTP แล้ว
          content:
            application/json:
              schema:
                type: object
                properties:
                  otp_ref: { type: string }
                  expires_at: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: authVerifyOtp
      summary: ยืนยัน OTP และรับ token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_ref, code]
              properties:
                otp_ref: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/oauth/{provider}:
    post:
      tags: [Auth]
      operationId: authOAuth
      summary: เข้าสู่ระบบผ่าน LINE / Google / Facebook
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [line, google, facebook] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code: { type: string, description: 'authorization code จาก provider' }
                redirect_uri: { type: string, format: uri }
                code_verifier: { type: string, description: 'PKCE verifier' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: ต่ออายุ access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: ออกจากระบบ (เพิกถอน refresh token)
      responses:
        '204': { description: 'สำเร็จ' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── Me ─────────────────────────
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: ข้อมูลบัญชีของฉัน
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: แก้ไขข้อมูลบัญชี / consent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: ขอลบบัญชีและข้อมูลส่วนบุคคล (PDPA)
      responses:
        '202': { description: 'รับคำขอแล้ว จะดำเนินการภายในระยะเวลาที่กฎหมายกำหนด' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/profiles:
    get:
      tags: [Me]
      operationId: listMyProfiles
      summary: รายการโปรไฟล์นักวิ่ง (ตัวเอง + เพื่อน/ครอบครัว)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RunnerProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Me]
      operationId: createMyProfile
      summary: เพิ่มโปรไฟล์นักวิ่ง
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerProfileInput' }
      responses:
        '201':
          description: สร้างแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Me]
      operationId: getMyProfile
      summary: ดูโปรไฟล์นักวิ่ง
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Me]
      operationId: updateMyProfile
      summary: แก้ไขโปรไฟล์นักวิ่ง
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerProfileInput' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Me]
      operationId: deleteMyProfile
      summary: ลบโปรไฟล์นักวิ่ง
      responses:
        '204': { description: 'ลบแล้ว' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders:
    get:
      tags: [Me]
      operationId: listMyOrders
      summary: ประวัติคำสั่งซื้อของฉัน
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/orders/{orderId}/receipt:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Me]
      operationId: getMyOrderReceipt
      summary: ดาวน์โหลดใบเสร็จ / ใบกำกับภาษี (PDF)
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [receipt, tax_invoice], default: receipt }
      responses:
        '200':
          description: ไฟล์ PDF
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderId}/tax-invoice:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Me]
      operationId: requestTaxInvoice
      summary: ขอใบกำกับภาษีเต็มรูป (ระบุชื่อบริษัท / เลขผู้เสียภาษี)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxInfo' }
      responses:
        '202': { description: 'รับคำขอแล้ว' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────── My Registrations ─────────────────────────
  /me/registrations:
    get:
      tags: [My Registrations]
      operationId: listMyRegistrations
      summary: งานที่ฉันสมัคร (รวมที่สมัครให้คนอื่น)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RegistrationStatus' }
        - name: upcoming
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/registrations/{registrationId}:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
    get:
      tags: [My Registrations]
      operationId: getMyRegistration
      summary: รายละเอียดการสมัคร (บิบ, QR สำหรับรับของ)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [My Registrations]
      operationId: updateMyRegistration
      summary: แก้ไขข้อมูลที่ผู้จัดอนุญาต (เช่น ไซซ์เสื้อ ผู้ติดต่อฉุกเฉิน) ก่อนวันปิดแก้ไข
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shirt_variant_id: { type: string, format: uuid }
                emergency_contact: { $ref: '#/components/schemas/EmergencyContact' }
                answers:
                  type: array
                  items: { $ref: '#/components/schemas/FormAnswer' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SoldOut' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/registrations/{registrationId}/transfer:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
    post:
      tags: [My Registrations]
      operationId: requestTransfer
      summary: โอนสิทธิ์ให้ผู้อื่น (ผู้รับต้องยืนยันและกรอกข้อมูล)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_email]
              properties:
                recipient_email: { type: string, format: email }
                message: { type: string, maxLength: 500 }
      responses:
        '201':
          description: สร้างคำขอโอนสิทธิ์แล้ว (อาจมีค่าธรรมเนียมที่ต้องชำระ)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /transfers/{transferId}/accept:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [My Registrations]
      operationId: acceptTransfer
      summary: ผู้รับยืนยันรับโอนสิทธิ์พร้อมข้อมูลผู้วิ่ง
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, participant]
              properties:
                token: { type: string, description: 'token จากอีเมลเชิญ' }
                participant: { $ref: '#/components/schemas/ParticipantInput' }
      responses:
        '200':
          description: โอนสิทธิ์สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/registrations/{registrationId}/change-race:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
    post:
      tags: [My Registrations]
      operationId: changeRace
      summary: เปลี่ยนระยะ (จ่ายส่วนต่างหรือรับเครดิตคืนตามนโยบาย)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_race_id]
              properties:
                target_race_id: { type: string, format: uuid }
      responses:
        '200':
          description: เปลี่ยนสำเร็จ หรือได้ order สำหรับชำระส่วนต่าง
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration: { $ref: '#/components/schemas/Registration' }
                  payment_order: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SoldOut' }
  /me/registrations/{registrationId}/refund-request:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
    post:
      tags: [My Registrations]
      operationId: requestRefund
      summary: ขอคืนเงิน (ตามนโยบายของงาน)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: สร้างคำขอคืนเงินแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/results:
    get:
      tags: [Me]
      operationId: listMyResults
      summary: ประวัติผลวิ่งและ PB ของฉัน
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Result' }
                  personal_bests:
                    type: array
                    items:
                      type: object
                      properties:
                        distance_km: { type: number }
                        chip_time_ms: { type: integer }
                        result_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/certificates/{registrationId}.pdf:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
    get:
      tags: [Me]
      operationId: downloadMyCertificate
      summary: ดาวน์โหลดใบประกาศ (e-Certificate)
      responses:
        '200':
          description: ไฟล์ PDF
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/virtual-submissions:
    post:
      tags: [My Registrations]
      operationId: submitVirtualRun
      summary: ส่งผล Virtual Run (อัปโหลดภาพหรือ activity จาก Strava/Garmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_id, source]
              properties:
                registration_id: { type: string, format: uuid }
                source: { type: string, enum: [upload, strava, garmin] }
                activity_id: { type: string }
                distance_m: { type: integer }
                elapsed_ms: { type: integer }
                activity_date: { type: string, format: date }
                proof_upload_id: { type: string }
      responses:
        '201':
          description: รับผลแล้ว รอตรวจสอบ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────── Public ─────────────────────────
  /events:
    get:
      tags: [Public Events]
      operationId: searchEvents
      summary: ค้นหางานวิ่ง
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: province
          in: query
          schema: { type: string }
        - name: month
          in: query
          description: รูปแบบ YYYY-MM
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: distance
          in: query
          schema: { type: string, enum: ['5k', '10k', half, full, ultra] }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/EventType' }
        - name: price_max
          in: query
          description: ราคาสูงสุด (สตางค์)
          schema: { type: integer, minimum: 0 }
        - name: registration_open
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [date, popular, closing_soon, newest], default: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSummaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /events/{slug}:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Public Events]
      operationId: getEventBySlug
      summary: รายละเอียดงาน
      security: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{slug}/races:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Public Events]
      operationId: listEventRaces
      summary: ระยะทั้งหมดพร้อมราคาปัจจุบันและโควต้าคงเหลือ
      security: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Race' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{slug}/products:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Public Events]
      operationId: listEventProducts
      summary: สินค้า/add-on ของงาน (เสื้อ ค่าส่ง ประกัน บริจาค)
      security: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{slug}/form:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Public Events]
      operationId: getEventForm
      summary: คำถามเพิ่มเติมในฟอร์มสมัคร
      security: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FormQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{slug}/results:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Public Results]
      operationId: listEventResults
      summary: ผลการแข่งขันของงาน
      security: []
      parameters:
        - name: race_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: ชื่อหรือเลขบิบ
          schema: { type: string }
        - name: gender
          in: query
          schema: { $ref: '#/components/schemas/Gender' }
        - name: age_group
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ResultStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{slug}/photos:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Public Results]
      operationId: searchEventPhotos
      summary: ค้นหารูปจากเลขบิบ
      security: []
      parameters:
        - name: bib
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Photo' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
  /results/{resultId}:
    get:
      tags: [Public Results]
      operationId: getResult
      summary: ผลรายบุคคลพร้อม split และอันดับ
      security: []
      parameters:
        - name: resultId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '404': { $ref: '#/components/responses/NotFound' }
  /results/{resultId}/certificate:
    get:
      tags: [Public Results]
      operationId: getResultCertificate
      summary: ข้อมูลใบประกาศ (ลิงก์ PDF / รูปสำหรับแชร์)
      security: []
      parameters:
        - name: resultId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organizers/{orgSlug}:
    get:
      tags: [Public Events]
      operationId: getOrganizerPublic
      summary: หน้าผู้จัดงานและรายการงาน
      security: []
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationPublic'
                  - type: object
                    properties:
                      events:
                        type: array
                        items: { $ref: '#/components/schemas/EventSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Waitlist ─────────────────────────
  /races/{raceId}/waitlist:
    parameters:
      - $ref: '#/components/parameters/RaceId'
    post:
      tags: [Waitlist]
      operationId: joinWaitlist
      summary: ลงชื่อรอเมื่อระยะเต็ม
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '201':
          description: ลงชื่อแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistEntry' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/waitlist:
    get:
      tags: [Waitlist]
      operationId: listMyWaitlist
      summary: รายการรอของฉัน
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WaitlistEntry' }
  /me/waitlist/{waitlistId}:
    parameters:
      - $ref: '#/components/parameters/WaitlistId'
    delete:
      tags: [Waitlist]
      operationId: leaveWaitlist
      summary: ยกเลิกการรอ
      responses:
        '204': { description: 'ยกเลิกแล้ว' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/waitlist/{waitlistId}/accept:
    parameters:
      - $ref: '#/components/parameters/WaitlistId'
    post:
      tags: [Waitlist]
      operationId: acceptWaitlistOffer
      summary: รับสิทธิ์ที่ได้รับข้อเสนอ (สร้าง checkout session พร้อม hold)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: สร้าง checkout session แล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Checkout ─────────────────────────
  /checkout/queue:
    post:
      tags: [Checkout]
      operationId: enterQueue
      summary: เข้าคิว waiting room ช่วงเปิดรับสมัคร
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id]
              properties:
                event_id: { type: string, format: uuid }
      responses:
        '200':
          description: สถานะคิว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueTicket' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /checkout/queue/{eventId}:
    get:
      tags: [Checkout]
      operationId: getQueueStatus
      summary: ตรวจสถานะคิว (เมื่อถึงคิวจะได้ admission_token)
      security:
        - userAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: สถานะคิว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /checkout/sessions:
    post:
      tags: [Checkout]
      operationId: createCheckoutSession
      summary: จองโควต้าชั่วคราว (hold 15 นาที)
      description: ล็อกโควต้าของระยะและสต็อกสินค้า ถ้าไม่ชำระภายใน `expires_at` ระบบจะคืนโควต้าอัตโนมัติ
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Queue-Admission
          in: header
          description: admission token จาก waiting room (บังคับเมื่อเปิดคิว)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, items]
              properties:
                event_id: { type: string, format: uuid }
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/CheckoutItemInput' }
                access_code:
                  type: string
                  description: รหัสโควต้าพิเศษ (VIP / สปอนเซอร์)
      responses:
        '201':
          description: จองสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/SoldOut' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /checkout/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Checkout]
      operationId: getCheckoutSession
      summary: ดู checkout session และเวลาที่เหลือ
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Checkout]
      operationId: cancelCheckoutSession
      summary: ยกเลิกและคืนโควต้าทันที
      responses:
        '204': { description: 'ยกเลิกแล้ว' }
        '404': { $ref: '#/components/responses/NotFound' }
  /checkout/sessions/{sessionId}/coupon:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Checkout]
      operationId: applyCoupon
      summary: ใช้คูปองส่วนลด
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: คำนวณยอดใหม่แล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Checkout]
      operationId: removeCoupon
      summary: เอาคูปองออก
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    post:
      tags: [Checkout]
      operationId: createOrder
      summary: สร้างคำสั่งซื้อจาก checkout session พร้อมข้อมูลผู้วิ่ง
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, participants]
              properties:
                session_id: { type: string, format: uuid }
                participants:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ParticipantInput' }
                tax_info: { $ref: '#/components/schemas/TaxInfo' }
                shipping_address: { $ref: '#/components/schemas/Address' }
                accept_waiver: { type: boolean, description: 'ยอมรับข้อตกลงและสละสิทธิ์เรียกร้อง' }
      responses:
        '201':
          description: สร้างแล้ว สถานะ PENDING_PAYMENT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Checkout]
      operationId: getOrder
      summary: ดูคำสั่งซื้อ (ใช้ poll สถานะการชำระเงิน)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Payments ─────────────────────────
  /orders/{orderId}/payments:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Payments]
      operationId: createPayment
      summary: เริ่มชำระเงิน (PromptPay QR / บัตร / Mobile Banking)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/PaymentMethod' }
                card_token: { type: string, description: 'token จาก gateway SDK (บัตรเครดิต)' }
                bank_code: { type: string, description: 'สำหรับ mobile_banking เช่น kbank, scb, bbl' }
                return_url: { type: string, format: uri }
      responses:
        '201':
          description: สร้างรายการชำระเงินแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /webhooks/payments/{gateway}:
    post:
      tags: [Payments]
      operationId: paymentWebhook
      summary: Webhook จาก payment gateway
      description: ตรวจลายเซ็นทุกครั้ง และประมวลผลแบบ idempotent ตาม event id ของ gateway
      security:
        - webhookSignature: []
      parameters:
        - name: gateway
          in: path
          required: true
          schema: { type: string, enum: [omise, 2c2p, gbprimepay, ksher, stripe] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: payload ตามรูปแบบของแต่ละ gateway
              additionalProperties: true
      responses:
        '200': { description: 'รับแล้ว (รวมถึง event ที่เคยประมวลผลแล้ว)' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── Organizer: Organization ─────────────────────────
  /org:
    get:
      tags: [Org Team]
      operationId: listMyOrganizations
      summary: องค์กรที่ฉันเป็นสมาชิก
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
    post:
      tags: [Org Team]
      operationId: createOrganization
      summary: สมัครเป็นผู้จัดงาน (รอแอดมินอนุมัติ KYC)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201':
          description: สร้างแล้ว สถานะ PENDING_REVIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /org/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Org Team]
      operationId: getOrganization
      summary: ข้อมูลองค์กร
      security:
        - orgAuth: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Org Team]
      operationId: updateOrganization
      summary: แก้ไขข้อมูลองค์กร / บัญชีธนาคาร (Owner)
      security:
        - orgAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────── Organizer: Events ─────────────────────────
  /org/{orgId}/events:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Org Events]
      operationId: orgListEvents
      summary: รายการงานขององค์กร
      security:
        - orgAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EventStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSummaryPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Org Events]
      operationId: orgCreateEvent
      summary: สร้างงานใหม่ (สถานะ DRAFT)
      security:
        - orgAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: สร้างแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /org/{orgId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Org Events]
      operationId: orgGetEvent
      summary: รายละเอียดงาน (รวมฟิลด์ภายใน)
      security:
        - orgAuth: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Org Events]
      operationId: orgUpdateEvent
      summary: แก้ไขงาน
      security:
        - orgAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Org Events]
      operationId: orgDeleteEvent
      summary: ลบงาน (เฉพาะ DRAFT ที่ยังไม่มีผู้สมัคร)
      security:
