components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token ของผู้ใช้ (นักวิ่ง)
    orgAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token ของผู้ใช้ที่เป็นสมาชิกองค์กร ตรวจ role (owner/admin/finance/staff/viewer) ในแต่ละ endpoint
    staffAuth:
      type: apiKey
      in: header
      name: X-Staff-Token
      description: Token ของ staff หน้างาน จำกัดเฉพาะงานและจุดรับของที่ได้รับมอบหมาย
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token ของแอดมินแพลตฟอร์ม (ต้องเปิด 2FA)
    timingApiKey:
      type: apiKey
      in: header
      name: X-Timing-Key
      description: API key ของ timing partner ผูกกับงาน
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: ลายเซ็น HMAC จาก payment gateway (ชื่อ header จริงต่างกันตาม gateway)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID เฉพาะของคำขอ ส่งซ้ำด้วย key เดิมจะได้ผลลัพธ์เดิม (เก็บ 24 ชม.)
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    RaceId:
      name: raceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WaitlistId:
      name: waitlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RefundId:
      name: refundId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: คำขอไม่ถูกต้อง
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: ไม่ได้เข้าสู่ระบบหรือ token ไม่ถูกต้อง
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: ไม่มีสิทธิ์
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: ไม่พบข้อมูล
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: สถานะขัดแย้ง (เช่น ข้อมูลซ้ำ หรือสถานะไม่อนุญาต)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SoldOut:
      description: โควต้าหรือสต็อกไม่พอ
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  type: { const: 'https://api.example.run/problems/sold-out' }
                  sold_out_items:
                    type: array
                    items:
                      type: object
                      properties:
                        race_id: { type: string, format: uuid }
                        variant_id: { type: string, format: uuid }
                        remaining: { type: integer }
                  waitlist_available: { type: boolean }
    Unprocessable:
      description: ข้อมูลไม่ผ่านการตรวจสอบ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: เรียกถี่เกินไป
      headers:
        Retry-After:
          schema: { type: integer }
          description: จำนวนวินาทีที่ควรรอ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── Common ──
    Problem:
      type: object
      description: RFC 7807 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'รหัส error ภายใน เช่น COUPON_EXPIRED' }
        errors:
          type: array
          description: รายละเอียดฟิลด์ที่ผิด
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Money:
      type: integer
      minimum: 0
      description: จำนวนเงินหน่วยสตางค์ (THB)
    LocalizedText:
      type: object
      required: [th]
      properties:
        th: { type: string }
        en: { type: string }
    Address:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        subdistrict: { type: string }
        district: { type: string }
        province: { type: string }
        postal_code: { type: string, pattern: '^[0-9]{5}$' }
        country: { type: string, default: TH }
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        result_url: { type: string, format: uri }
        summary: { type: object, additionalProperties: true }
        error: { type: string }
        created_at: { type: string, format: date-time }

    # ── Enums ──
    Gender:
      type: string
      enum: [male, female, other]
    EventType:
      type: string
      enum: [road, trail, virtual, ultra, fun_run]
    EventStatus:
      type: string
      enum: [draft, pending_review, approved, published, registration_closed, completed, cancelled]
    OrderStatus:
      type: string
      enum: [pending_payment, paid, expired, cancelled, partially_refunded, refunded]
    RegistrationStatus:
      type: string
      enum: [pending, confirmed, cancelled, transferred, refunded]
    PaymentMethod:
      type: string
      enum: [promptpay, card, mobile_banking, truemoney, offline]
    PaymentStatus:
      type: string
      enum: [pending, succeeded, failed, expired]
    RefundStatus:
      type: string
      enum: [requested, approved, rejected, processing, succeeded, failed]
    ResultStatus:
      type: string
      enum: [finished, dnf, dns, dq, pending_review]
    PayoutStatus:
      type: string
      enum: [pending, processing, paid, on_hold]
    OrgRole:
      type: string
      enum: [owner, admin, finance, staff, viewer]
    OrganizationStatus:
      type: string
      enum: [pending_review, active, suspended, rejected]

    # ── Auth / User ──
    AuthTokens:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: 'วินาที' }
        user: { $ref: '#/components/schemas/User' }
    Consents:
      type: object
      description: consent ตาม PDPA แยกตามวัตถุประสงค์
      properties:
        marketing_email: { type: boolean }
        marketing_line: { type: boolean }
        share_with_sponsors: { type: boolean }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        phone: { type: string }
        display_name: { type: string }
        avatar_url: { type: string, format: uri }
        locale: { type: string, enum: [th, en] }
        linked_providers:
          type: array
          items: { type: string, enum: [line, google, facebook] }
        consents: { $ref: '#/components/schemas/Consents' }
        status: { type: string, enum: [active, suspended, pending_deletion] }
        created_at: { type: string, format: date-time }
    UserUpdate:
      type: object
      properties:
        display_name: { type: string }
        phone: { type: string }
        locale: { type: string, enum: [th, en] }
        consents: { $ref: '#/components/schemas/Consents' }
    EmergencyContact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        relationship: { type: string }
        phone: { type: string }
    RunnerProfileInput:
      type: object
      required: [first_name_th, last_name_th, birth_date, gender, nationality, id_type, id_number]
      properties:
        first_name_th: { type: string }
        last_name_th: { type: string }
        first_name_en: { type: string }
        last_name_en: { type: string }
        bib_name: { type: string, maxLength: 12, description: 'ชื่อที่พิมพ์บนบิบ' }
        birth_date: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        nationality: { type: string, description: 'ISO 3166-1 alpha-2' }
        id_type: { type: string, enum: [thai_id, passport] }
        id_number: { type: string, writeOnly: true }
        email: { type: string, format: email }
        phone: { type: string }
        blood_type: { type: string, enum: ['A', 'B', 'AB', 'O', 'unknown'] }
        medical_conditions: { type: string }
        emergency_contact: { $ref: '#/components/schemas/EmergencyContact' }
        shirt_size: { type: string }
        address: { $ref: '#/components/schemas/Address' }
        is_self: { type: boolean }
    RunnerProfile:
      allOf:
        - $ref: '#/components/schemas/RunnerProfileInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            id_number_masked: { type: string, readOnly: true, examples: ['x-xxxx-xxxxx-12-3'] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    # ── Organization ──
    OrganizationPublic:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        logo_url: { type: string, format: uri }
        description: { type: string }
        website: { type: string, format: uri }
        facebook_url: { type: string, format: uri }
        line_oa: { type: string }
    OrganizationInput:
      type: object
      required: [name, legal_name, tax_id]
      properties:
        name: { type: string }
        slug: { type: string }
        legal_name: { type: string }
        entity_type: { type: string, enum: [company, foundation, government, individual] }
        tax_id: { type: string, pattern: '^[0-9]{13}$' }
        address: { $ref: '#/components/schemas/Address' }
        contact_email: { type: string, format: email }
        contact_phone: { type: string }
        bank_account:
          type: object
          properties:
            bank_code: { type: string }
            account_name: { type: string }
            account_number: { type: string, writeOnly: true }
        kyc_document_ids:
          type: array
          items: { type: string }
        logo_url: { type: string, format: uri }
        description: { type: string }
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/OrganizationStatus' }
            fee_plan: { $ref: '#/components/schemas/FeePlan' }
            my_role: { $ref: '#/components/schemas/OrgRole' }
            created_at: { type: string, format: date-time }
    OrganizationPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    OrgMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/OrgRole' }
        status: { type: string, enum: [invited, active] }
        created_at: { type: string, format: date-time }
    FeePlan:
      type: object
      required: [percent_bps, fixed_satang, payer]
      properties:
        percent_bps: { type: integer, minimum: 0, description: 'ค่าธรรมเนียมแพลตฟอร์มเป็น basis point (500 = 5%)' }
        fixed_satang: { $ref: '#/components/schemas/Money' }
        payer: { type: string, enum: [organizer, runner], description: 'ใครเป็นผู้จ่ายค่าธรรมเนียม' }
        payment_fee_passthrough: { type: boolean, description: 'ส่งค่าธรรมเนียม gateway ไปยังผู้จัด' }

    # ── Event / Race ──
    EventInput:
      type: object
      required: [name, type, event_date, province]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        slug: { type: string }
        type: { $ref: '#/components/schemas/EventType' }
        event_date: { type: string, format: date }
        timezone: { type: string, default: Asia/Bangkok }
        province: { type: string }
        venue: { type: string }
        location:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
        description: { $ref: '#/components/schemas/LocalizedText' }
        cover_image_url: { type: string, format: uri }
        gallery:
          type: array
          items: { type: string, format: uri }
        schedule:
          type: array
          items:
            type: object
            properties:
              time: { type: string }
              title: { type: string }
        rules: { $ref: '#/components/schemas/LocalizedText' }
        refund_policy: { $ref: '#/components/schemas/LocalizedText' }
        faq:
          type: array
          items:
            type: object
            properties:
              q: { type: string }
              a: { type: string }
        registration_opens_at: { type: string, format: date-time }
        registration_closes_at: { type: string, format: date-time }
        edit_closes_at: { type: string, format: date-time, description: 'วันสุดท้ายที่นักวิ่งแก้ข้อมูลเองได้' }
        allow_transfer: { type: boolean, default: false }
        transfer_fee_satang: { $ref: '#/components/schemas/Money' }
        allow_race_change: { type: boolean, default: false }
        race_change_fee_satang: { $ref: '#/components/schemas/Money' }
        allow_refund_request: { type: boolean, default: false }
        waitlist_enabled: { type: boolean, default: false }
        queue_enabled: { type: boolean, default: false, description: 'เปิด waiting room ช่วงเปิดรับสมัคร' }
        age_reference: { type: string, enum: [race_day, year_end], default: race_day }
        max_per_order: { type: integer, minimum: 1, default: 10 }
    Event:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/EventStatus' }
            organizer: { $ref: '#/components/schemas/OrganizationPublic' }
            races:
              type: array
              items: { $ref: '#/components/schemas/Race' }
            featured: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    EventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        type: { $ref: '#/components/schemas/EventType' }
        event_date: { type: string, format: date }
        province: { type: string }
        cover_image_url: { type: string, format: uri }
        distances_km:
          type: array
          items: { type: number }
        min_price_satang: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/EventStatus' }
        registration_closes_at: { type: string, format: date-time }
        sold_out: { type: boolean }
    EventSummaryPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EventSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    AgeGroup:
      type: object
      required: [code, min_age, max_age]
      properties:
        code: { type: string, examples: ['M30-39'] }
        gender: { $ref: '#/components/schemas/Gender' }
        min_age: { type: integer }
        max_age: { type: integer }
    RaceInput:
      type: object
      required: [name, distance_km, capacity]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        distance_km: { type: number, minimum: 0 }
        start_time: { type: string, format: date-time }
        cutoff_minutes: { type: integer, minimum: 1 }
        capacity: { type: integer, minimum: 0 }
        min_age: { type: integer, minimum: 0 }
        max_age: { type: integer }
        gender_restriction: { $ref: '#/components/schemas/Gender' }
        requires_qualification: { type: boolean, default: false, description: 'ต้องแนบผลวิ่งยืนยันคุณสมบัติ (เช่น Ultra)' }
        bib_prefix: { type: string }
        bib_range_start: { type: integer }
        bib_range_end: { type: integer }
        age_groups:
          type: array
          items: { $ref: '#/components/schemas/AgeGroup' }
        route_map_url: { type: string, format: uri }
        gpx_url: { type: string, format: uri }
        elevation_gain_m: { type: integer }
        included_product_ids:
          type: array
          description: สินค้าที่รวมในค่าสมัคร (เช่น เสื้อ เหรียญ)
          items: { type: string, format: uuid }
        sort_order: { type: integer }
    Race:
      allOf:
        - $ref: '#/components/schemas/RaceInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            sold: { type: integer, readOnly: true }
            held: { type: integer, readOnly: true, description: 'จำนวนที่ถูก hold อยู่ใน checkout' }
            remaining: { type: integer, readOnly: true }
            current_price: { $ref: '#/components/schemas/PriceTier' }
            price_tiers:
              type: array
              items: { $ref: '#/components/schemas/PriceTier' }
    PriceTierInput:
      type: object
      required: [name, price_satang, starts_at]
      properties:
        name: { type: string, examples: [Early Bird] }
        price_satang: { $ref: '#/components/schemas/Money' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        quota: { type: integer, minimum: 1, description: 'จำนวนจำกัดของช่วงราคานี้ (ว่าง = ไม่จำกัด)' }
        audience: { type: string, enum: [public, access_code], default: public }
    PriceTier:
      allOf:
        - $ref: '#/components/schemas/PriceTierInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            race_id: { type: string, format: uuid }
            sold: { type: integer, readOnly: true }
            active: { type: boolean, readOnly: true }

    # ── Product ──
    VariantInput:
      type: object
      required: [name]
      properties:
        name: { type: string, examples: [M] }
        sku: { type: string }
        chest_inch: { type: number }
        length_inch: { type: number }
        stock: { type: integer, minimum: 0, description: 'ว่าง = ไม่จำกัด' }
        price_delta_satang: { type: integer, description: 'ราคาเพิ่ม/ลดจากราคาสินค้า (สตางค์)' }
    Variant:
      allOf:
        - $ref: '#/components/schemas/VariantInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            sold: { type: integer, readOnly: true }
            remaining: { type: integer, readOnly: true }
    ProductInput:
      type: object
      required: [name, kind, price_satang]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        kind: { type: string, enum: [shirt, medal, shipping, insurance, donation, merchandise, photo] }
        description: { $ref: '#/components/schemas/LocalizedText' }
        image_url: { type: string, format: uri }
        size_chart_url: { type: string, format: uri }
        price_satang: { $ref: '#/components/schemas/Money' }
        per_participant: { type: boolean, description: 'ผูกกับผู้วิ่งแต่ละคน (เช่น เสื้อ) หรือผูกกับ order (เช่น ค่าส่ง)' }
        required: { type: boolean, default: false }
        max_per_order: { type: integer }
        race_ids:
          type: array
          description: จำกัดเฉพาะระยะ (ว่าง = ทุกระยะ)
          items: { type: string, format: uuid }
        variants:
          type: array
          items: { $ref: '#/components/schemas/VariantInput' }
        active: { type: boolean, default: true }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            variants:
              type: array
              items: { $ref: '#/components/schemas/Variant' }

    # ── Form ──
    FormQuestionInput:
      type: object
      required: [label, type]
      properties:
        label: { $ref: '#/components/schemas/LocalizedText' }
        help_text: { $ref: '#/components/schemas/LocalizedText' }
        type: { type: string, enum: [text, textarea, number, date, select, multi_select, checkbox, file] }
        options:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { $ref: '#/components/schemas/LocalizedText' }
        required: { type: boolean, default: false }
        race_ids:
          type: array
          items: { type: string, format: uuid }
        is_sensitive: { type: boolean, default: false, description: 'ข้อมูลอ่อนไหว (สุขภาพ) จำกัดผู้ที่เห็นได้' }
        sort_order: { type: integer }
    FormQuestion:
      allOf:
        - $ref: '#/components/schemas/FormQuestionInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
    FormAnswer:
      type: object
      required: [question_id]
      properties:
        question_id: { type: string, format: uuid }
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items: { type: string }

    # ── Coupon ──
    CouponInput:
      type: object
      required: [code, discount_type, discount_value]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{3,32}$' }
        discount_type: { type: string, enum: [percent, fixed] }
        discount_value: { type: integer, minimum: 1, description: 'percent = 1-100, fixed = สตางค์' }
        applies_to: { type: string, enum: [registration, order], default: registration }
        race_ids:
          type: array
          items: { type: string, format: uuid }
        max_uses: { type: integer, minimum: 1 }
        max_uses_per_user: { type: integer, minimum: 1 }
        min_participants: { type: integer, minimum: 1, description: 'ใช้สำหรับส่วนลดกลุ่ม' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean, default: true }
    Coupon:
      allOf:
        - $ref: '#/components/schemas/CouponInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            used_count: { type: integer, readOnly: true }

    # ── Checkout / Order ──
    CheckoutItemInput:
      type: object
      required: [kind, quantity]
      properties:
        kind: { type: string, enum: [race, product] }
        race_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        amount_satang: { type: integer, minimum: 0, description: 'ใช้กับ donation ที่ระบุจำนวนเอง' }
    CheckoutSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [active, converted, expired, cancelled] }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        coupon_code: { type: string }
        subtotal_satang: { $ref: '#/components/schemas/Money' }
        discount_satang: { $ref: '#/components/schemas/Money' }
        fee_satang: { $ref: '#/components/schemas/Money' }
        total_satang: { $ref: '#/components/schemas/Money' }
        expires_at: { type: string, format: date-time }
    QueueTicket:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [not_required, not_joined, waiting, admitted] }
        position: { type: integer, nullable: true, description: '1 = คนถัดไป' }
        waiting: { type: integer }
        admit_per_minute: { type: integer }
        estimated_wait_seconds: { type: integer }
        admission_token: { type: string, description: 'ใช้ใน header X-Queue-Admission' }
        admission_expires_at: { type: string, format: date-time }
    ParticipantInput:
      type: object
      required: [race_id]
      description: ผู้วิ่ง 1 คน ใส่ profile_id เพื่อดึงโปรไฟล์ที่บันทึกไว้ หรือกรอก profile ใหม่
      properties:
        race_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile: { $ref: '#/components/schemas/RunnerProfileInput' }
        save_profile: { type: boolean, default: true }
        shirt_variant_id: { type: string, format: uuid }
        addon_items:
          type: array
          items: { $ref: '#/components/schemas/CheckoutItemInput' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/FormAnswer' }
        team_name: { type: string }
        qualification_upload_id: { type: string }
    TaxInfo:
      type: object
      required: [name, tax_id, address]
      properties:
        name: { type: string }
        tax_id: { type: string, pattern: '^[0-9]{13}$' }
        branch: { type: string, default: '00000' }
        address: { type: string }
        email: { type: string, format: email }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [race, product, donation, fee] }
        description: { type: string }
        race_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        price_tier_id: { type: string, format: uuid }
        registration_id: { type: string, format: uuid }
        quantity: { type: integer }
        unit_price_satang: { $ref: '#/components/schemas/Money' }
        discount_satang: { $ref: '#/components/schemas/Money' }
        total_satang: { $ref: '#/components/schemas/Money' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [RN-2026-000123] }
        event_id: { type: string, format: uuid }
        buyer_user_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        registrations:
          type: array
          items: { $ref: '#/components/schemas/Registration' }
        coupon_code: { type: string }
        subtotal_satang: { $ref: '#/components/schemas/Money' }
        discount_satang: { $ref: '#/components/schemas/Money' }
        fee_satang: { $ref: '#/components/schemas/Money' }
        total_satang: { $ref: '#/components/schemas/Money' }
        refunded_satang: { $ref: '#/components/schemas/Money' }
        currency: { type: string, const: THB }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        tax_info: { $ref: '#/components/schemas/TaxInfo' }
        shipping_address: { $ref: '#/components/schemas/Address' }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    OrderPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        gateway: { type: string, enum: [omise, 2c2p, gbprimepay, ksher, stripe, offline] }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount_satang: { $ref: '#/components/schemas/Money' }
        gateway_ref: { type: string }
        promptpay_qr:
          type: object
          description: มีเมื่อ method = promptpay
          properties:
            qr_image_url: { type: string, format: uri }
            qr_payload: { type: string }
        authorize_uri: { type: string, format: uri, description: 'URL สำหรับ redirect (3DS / mobile banking)' }
        failure_code: { type: string }
        failure_message: { type: string }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        registration_id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RefundStatus' }
        amount_satang: { $ref: '#/components/schemas/Money' }
        reason: { type: string }
        requested_by: { type: string, enum: [runner, organizer, admin, system] }
        decided_by: { type: string, format: uuid }
        gateway_ref: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    # ── Registration ──
    Registration:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_name: { type: string }
        race_id: { type: string, format: uuid }
        race_name: { type: string }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        participant:
          allOf:
            - $ref: '#/components/schemas/RunnerProfileInput'
          description: snapshot ข้อมูลผู้วิ่ง ณ วันที่สมัคร
        age_on_race_day: { type: integer }
        age_group: { type: string }
        shirt_variant_id: { type: string, format: uuid }
        shirt_size: { type: string }
        addons:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/FormAnswer' }
        bib_number: { type: string }
        qr_token: { type: string, description: 'ใช้แสดง QR สำหรับรับของหน้างาน' }
        team_name: { type: string }
        checkins:
          type: array
          items: { $ref: '#/components/schemas/Checkin' }
        result_id: { type: string, format: uuid }
        can_transfer: { type: boolean }
        can_change_race: { type: boolean }
        can_request_refund: { type: boolean }
        created_at: { type: string, format: date-time }
    RegistrationPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Registration' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        registration_id: { type: string, format: uuid }
        from_user_id: { type: string, format: uuid }
        recipient_email: { type: string, format: email }
        status: { type: string, enum: [pending_fee, pending_acceptance, completed, cancelled, expired] }
        fee_satang: { $ref: '#/components/schemas/Money' }
        fee_order_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    WaitlistEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        race_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        quantity: { type: integer }
        position: { type: integer }
        status: { type: string, enum: [waiting, offered, accepted, expired, cancelled] }
        offer_expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    # ── Check-in ──
    CheckinPoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [race_kit, shirt, medal, bag_drop, start] }
        race_ids:
          type: array
          items: { type: string, format: uuid }
        checked_in_count: { type: integer, readOnly: true }
        expected_count: { type: integer, readOnly: true }
    StaffAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        checkin_point_ids:
          type: array
          items: { type: string, format: uuid }
        valid_until: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked: { type: boolean }
    Checkin:
      type: object
      properties:
        id: { type: string, format: uuid }
        registration_id: { type: string, format: uuid }
        point_id: { type: string, format: uuid }
        staff_id: { type: string, format: uuid }
        picked_up_by: { type: string, enum: [self, proxy] }
        proxy_name: { type: string }
        shirt_size_given: { type: string }
        source: { type: string, enum: [online, offline_sync] }
        checked_in_at: { type: string, format: date-time }
    CheckinLookup:
      type: object
      description: ข้อมูลเท่าที่ staff จำเป็นต้องเห็น (ไม่รวมเลขบัตรเต็ม/ข้อมูลสุขภาพ)
      properties:
        registration_id: { type: string, format: uuid }
        bib_number: { type: string }
        name: { type: string }
        race_name: { type: string }
        shirt_size: { type: string }
        addons:
          type: array
          items: { type: string }
        id_last4: { type: string }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        already_checked_in: { type: boolean }
        previous_checkin: { $ref: '#/components/schemas/Checkin' }
        warnings:
          type: array
          items: { type: string, examples: [registration_cancelled, wrong_point] }

    # ── Result ──
    Split:
      type: object
      properties:
        checkpoint: { type: string }
        distance_km: { type: number }
        elapsed_ms: { type: integer }
        pace_sec_per_km: { type: integer }
        timestamp: { type: string, format: date-time }
    Result:
      type: object
      properties:
        id: { type: string, format: uuid }
        registration_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        race_id: { type: string, format: uuid }
        race_name: { type: string }
        bib_number: { type: string }
        name: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        age_group: { type: string }
        status: { $ref: '#/components/schemas/ResultStatus' }
        source: { type: string, enum: [chip, manual, virtual] }
        chip_time_ms: { type: integer }
        gun_time_ms: { type: integer }
        pace_sec_per_km: { type: integer }
        rank_overall: { type: integer }
        rank_gender: { type: integer }
        rank_age_group: { type: integer }
        splits:
          type: array
          items: { $ref: '#/components/schemas/Split' }
        official: { type: boolean }
        published: { type: boolean }
        certificate: { $ref: '#/components/schemas/Certificate' }
    ResultPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Result' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Certificate:
      type: object
      properties:
        id: { type: string, format: uuid }
        result_id: { type: string, format: uuid }
        pdf_url: { type: string, format: uri }
        image_url: { type: string, format: uri, description: 'รูปสำหรับแชร์โซเชียล' }
        share_url: { type: string, format: uri }
        generated_at: { type: string, format: date-time }
    CertificateTemplate:
      type: object
      required: [background_url, fields]
      properties:
        background_url: { type: string, format: uri }
        page_size: { type: string, enum: [A4_landscape, A4_portrait, square_1080], default: A4_landscape }
        fields:
          type: array
          items:
            type: object
            required: [key, x, y]
            properties:
              key: { type: string, enum: [name, bib, race, chip_time, gun_time, pace, rank_overall, rank_gender, rank_age_group, event_date] }
              x: { type: number }
              y: { type: number }
              font_size: { type: number }
              color: { type: string }
              align: { type: string, enum: [left, center, right] }
    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
        thumbnail_url: { type: string, format: uri }
        full_url: { type: string, format: uri }
        photographer: { type: string }
        price_satang: { $ref: '#/components/schemas/Money' }
        taken_at: { type: string, format: date-time }

    # ── Communication ──
    BroadcastInput:
      type: object
      required: [channels, subject, body, audience]
      properties:
        channels:
          type: array
          minItems: 1
          items: { type: string, enum: [email, line, sms] }
        subject: { type: string }
        body: { type: string, description: 'รองรับตัวแปร เช่น {{first_name}}, {{bib}}' }
        audience:
          type: object
          properties:
            race_ids:
              type: array
              items: { type: string, format: uuid }
            statuses:
              type: array
              items: { $ref: '#/components/schemas/RegistrationStatus' }
            checked_in: { type: boolean }
        scheduled_at: { type: string, format: date-time }
    Broadcast:
      allOf:
        - $ref: '#/components/schemas/BroadcastInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [scheduled, sending, sent, failed] }
            recipient_count: { type: integer }
            delivered_count: { type: integer }
            created_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }

    # ── Finance ──
    EventDashboard:
      type: object
      properties:
        registrations_total: { type: integer }
        registrations_today: { type: integer }
        gross_satang: { $ref: '#/components/schemas/Money' }
        net_satang: { $ref: '#/components/schemas/Money' }
        refunded_satang: { $ref: '#/components/schemas/Money' }
        by_race:
          type: array
          items:
            type: object
            properties:
              race_id: { type: string, format: uuid }
              name: { type: string }
              capacity: { type: integer }
              sold: { type: integer }
              remaining: { type: integer }
        shirt_sizes:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: string, format: uuid }
              size: { type: string }
              sold: { type: integer }
              stock: { type: integer }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              registrations: { type: integer }
              gross_satang: { $ref: '#/components/schemas/Money' }
        checkin_rate: { type: number, minimum: 0, maximum: 1 }
    FinanceSummary:
      type: object
      properties:
        gross_satang: { $ref: '#/components/schemas/Money' }
        platform_fee_satang: { $ref: '#/components/schemas/Money' }
        payment_fee_satang: { $ref: '#/components/schemas/Money' }
        refunded_satang: { $ref: '#/components/schemas/Money' }
        net_satang: { $ref: '#/components/schemas/Money' }
        paid_out_satang: { $ref: '#/components/schemas/Money' }
        pending_payout_satang: { $ref: '#/components/schemas/Money' }
        reserve_satang: { $ref: '#/components/schemas/Money', description: 'เงินกันไว้สำหรับคืนเงิน/chargeback' }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [sale, refund, platform_fee, payment_fee, payout, adjustment, chargeback] }
        order_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        amount_satang: { type: integer, description: 'บวก = เงินเข้าผู้จัด, ลบ = เงินออก' }
        description: { type: string }
        occurred_at: { type: string, format: date-time }
    TransactionPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        gross_satang: { $ref: '#/components/schemas/Money' }
        fees_satang: { $ref: '#/components/schemas/Money' }
        refunds_satang: { $ref: '#/components/schemas/Money' }
        withholding_tax_satang: { $ref: '#/components/schemas/Money' }
        amount_satang: { $ref: '#/components/schemas/Money' }
        bank_ref: { type: string }
        statement_url: { type: string, format: uri }
        paid_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    # ── Admin ──
    CmsItem:
      type: object
      required: [title]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        slug: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }
        image_url: { type: string, format: uri }
        link_url: { type: string, format: uri }
        position: { type: integer }
        published: { type: boolean }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_type: { type: string, enum: [user, org_member, staff, admin, system] }
        actor_id: { type: string, format: uuid }
        action: { type: string, examples: [registration.update] }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        changes:
          type: object
          additionalProperties: true
          description: ค่าก่อน/หลัง (ปิดบังข้อมูลอ่อนไหว)
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
    Report:
      type: object
      properties:
        report: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { type: object, additionalProperties: true }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
